# golangci-lint v1-compatible config (schema supported by v1.55+).
# CI pins v1.59.1 via golangci/golangci-lint-action@v6, which downloads a
# prebuilt release binary (not a `go install` from source). Local dev on a
# newer Go toolchain may need to use a newer v1.x (e.g. v1.64.8) because
# v1.59.1's dependencies do not build from source under Go 1.23+; this is
# safe because both versions honour the same v1 schema.
# When upgrading to v2, migrate `run.skip-dirs` to `issues.exclude-dirs`.

run:
  timeout: 5m
  tests: true
  # Skip the e2e testscript harness entirely: it uses package-level patterns
  # (custom-cmd signatures, global os.Stdout swaps) that trip several linters
  # without signal. Rely on `go vet` and the harness's own fixtures for
  # correctness there.
  skip-dirs:
    - test/e2e

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gofmt
    - goimports
    - unused
    - ineffassign
    - unconvert
    - gocritic
    - revive

linters-settings:
  gofmt:
    simplify: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - ifElseChain
      - singleCaseSwitch
      # omap.Value is a tagged union (~96 bytes); passing by value is the
      # intended calling convention across the three format encoders and
      # the omaptest equality helper. Chasing pointer-passing for gocritic's
      # hugeParam gains no measurable perf in a CLI tool and costs readability.
      - hugeParam
      # EqualDocs returns (bool, string) where the semantics are obvious at
      # the call site; adding names does not improve readability.
      - unnamedResult
