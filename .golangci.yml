# golangci-lint v2 config.
# CI uses golangci-lint v2.x via golangci/golangci-lint-action@v8.0.0.
# Timeout is passed as --timeout=5m via the action args and the local lint
# target. See README for pin rationale.

version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - unconvert
    - gocritic
    - revive

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        # omap.Value is a tagged union (~96 bytes); passing by value is the
        # intended calling convention. Pointer-chasing gains nothing in a CLI.
        - hugeParam
        # EqualDocs returns (bool, string) where semantics are obvious at call site.
        - unnamedResult

  exclusions:
    paths:
      # Skip the e2e testscript harness: package-level patterns (custom-cmd
      # signatures, global os.Stdout swaps) trip linters without signal.
      # Rely on go vet and the harness's own fixtures for correctness.
      - test/e2e

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
