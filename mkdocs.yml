site_name: nesdit
site_description: Edit structured config (JSON/YAML/TOML) with jq-style queries
site_url: https://sdkks.github.io/nesdit/
repo_url: https://github.com/sdkks/nesdit
repo_name: sdkks/nesdit
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition

nav:
  - Home: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - Modes:
    - In-place (-i): modes/in-place.md
    - Stdout (default): modes/stdout.md
    - STDIN stream: modes/stdin.md
    - Dry-run (-n): modes/dryrun.md
    - Check (--check): modes/check.md
    - Expression builder (--edit): modes/edit.md
  - Examples:
    - Format round-trips: examples/formats/index.md
    - Data structures: examples/data-structures/index.md
    - Expressions: examples/expressions/index.md
    - Pipelines: examples/pipelines/index.md
    - Error diagnostics: examples/errors/index.md
  - Reference:
    - nesdit: reference/nesdit.md
