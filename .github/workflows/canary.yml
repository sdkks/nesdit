# canary.yml — non-blocking dependency canary.
#
# Test the latest gojq and go-toml/v2 together on the baseline from go.mod.
# go-toml/v2's /unstable API and future dependency Go requirements can drift.
# Primary CI tests the locked graph; this canary tests upstream dependency
# risk, not an unsupported or unreleased compiler. Automatic Go toolchain
# selection may advance the compiler if an upgraded dependency requires it.
# A red canary signals an upgrade needs attention; it does NOT gate merges.
#
# WARNING: This job MUST NOT become a required branch-protection check.
#   continue-on-error is on individual steps so failures are visible as
#   red steps while the overall job still completes. If this job were
#   required, a failing canary step would silently appear "passing" due
#   to continue-on-error, making branch protection vacuous.
#
# Linter v2.14.0 matches primary CI and supports the baseline compiler.

name: canary

on:
  schedule:
    # Weekly Monday 06:00 UTC — picks up upstream drift between PR bursts.
    - cron: '0 6 * * 1'
  pull_request:
    # Any dependabot bump or hand-edited module graph change is exercised.
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-bump:
    name: canary (baseline Go + gojq@latest + go-toml/v2@latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking: a red canary must not block the main merge gate.
    # continue-on-error is set at the step level (not job level) so
    # individual step failures surface as visible red in the UI while
    # the job still completes successfully and does not block PRs.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Bump coupled dependencies to @latest
        # One atomic step: both bumps land together so the canary reflects
        # the joint upgrade path the main branch will take when it flips.
        run: |
          set -eux
          go get -u \
            github.com/pelletier/go-toml/v2@latest \
            github.com/itchyny/gojq@latest
          go mod tidy
          echo "--- go.mod after bump ---"
          cat go.mod
          echo "--- resolved versions (triage) ---"
          go list -m all | grep -E '(gojq|go-toml)'
      - name: Install golangci-lint
        # Pinned to v8.0.0 (SHA verified via check-action-pins on 2026-04-27).
        # SHA → tag: 4afd733a84b1f43292c63897423277bb7f4313a9 → v8.0.0
        # Matches primary CI (ci.yml) — both run golangci-lint v2.14.0.
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          args: --timeout=5m
        continue-on-error: true
      - name: make lint
        run: make lint
        continue-on-error: true
      - name: make test-all
        run: make test-all
        continue-on-error: true
