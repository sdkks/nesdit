# docs.yml — build and deploy mkdocs site to GitHub Pages.
#
# Triggered on push to main when docs or gendocs sources change.
# The generated reference docs (docs/reference/) are rebuilt each time
# via gendocs, then the full mkdocs-material site is deployed to the
# gh-pages branch.
#
# GitHub Pages must be configured to serve from the gh-pages branch:
#   Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
#
# SHA → tag mappings verified via scripts/check-action-pins.sh.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'cmd/gendocs/**'
      - 'internal/run/run.go'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Generate CLI reference docs
        run: go run ./cmd/gendocs --out docs/reference

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --verbose
