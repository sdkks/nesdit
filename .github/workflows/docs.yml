# docs.yml — path-filtered docs build placeholder.
#
# v1 ships the gendocs CLI as a stub (see cmd/gendocs/main.go). This workflow
# runs `make docs` on docs/** changes so the pipeline exercises the build,
# but it does NOT publish anything.
#
# v1.1 brings the real mkdocs build + gh-pages deploy. Track the upgrade in
# SPEC-0001 §5 (Manpage & CLI reference workflow). When deploy lands, also
# widen `permissions:` (pages: write, id-token: write).
name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'cmd/gendocs/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cmd/gendocs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.22'
          cache: true
      - name: make docs (stub until STORY-0003 / v1.1)
        run: make docs
