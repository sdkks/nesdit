name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "test/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".goreleaser.yml"
      - ".releaserc.yml"
      - "Makefile"
      - "scripts/**"
      - ".golangci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TASK-0020: SHA↔tag consistency guard — catches lying `# <tag>` comments
  # on action pins before they can cause BUG-0002-class breakage.
  # Runs as a fast, standalone check on ubuntu with gh CLI available; does
  # NOT need Go or the full matrix, so it completes before the matrix starts.
  check-action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify SHA↔tag consistency for all pinned actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-action-pins.sh

  test:
    needs: check-action-pins
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22", "1.23"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Install golangci-lint
        # TASK-0021: migrated to golangci-lint v2 + action v8.0.0.
        # v8.0.0 is the first action major that requires golangci-lint v2.x.
        # SHA → tag mapping verified via `gh api
        # repos/golangci/golangci-lint-action/git/ref/tags/v8.0.0` on 2026-04-27
        # (annotated tag 25e2cdc5 → commit 4afd733a).
        # Release: https://github.com/golangci/golangci-lint-action/releases/tag/v8.0.0
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4
          args: --timeout=5m
      - name: make lint
        run: make lint
      - name: make test-all
        run: make test-all
      - name: Binary size guardrail (< 8 MiB)
        # SPEC-0001 / STORY-0003 guardrail: a release-shape nesdit binary
        # MUST stay under 8 MiB so the single-binary distribution story
        # holds. `wc -c < file` is portable across macOS and linux
        # (avoids GNU-only `stat -c%s`).
        # TASK-0010: -ldflags='-s -w' strips debug info; new baseline ~4.13 MiB
        # (darwin/arm64, 2026-04-27). Previous debug baseline was ~5.83 MiB.
        run: |
          bytes=$(wc -c < bin/nesdit | tr -d ' ')
          limit=8388608
          echo "nesdit binary size: ${bytes} bytes (limit: ${limit})"
          if [ "${bytes}" -ge "${limit}" ]; then
            echo "::error::nesdit binary exceeded 8 MiB limit (${bytes} >= ${limit})"
            exit 1
          fi

