name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Install golangci-lint
        # BUG-0002: pin to real v6.5.2 SHA — v6.x is the last action major
        # that supports golangci-lint v1.x (see release notes). v7.0.0+ is
        # v2-only and rejects `version: v1.*` at startup.
        # SHA → tag mapping verified via `gh api
        # repos/golangci/golangci-lint-action/tags` on 2026-04-26.
        # Release: https://github.com/golangci/golangci-lint-action/releases/tag/v6.5.2
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2 (supports golangci-lint v1.x)
        with:
          version: v1.59.1
          args: --timeout=5m
      - name: make lint
        run: make lint
      - name: make test-all
        run: make test-all
      - name: Binary size guardrail (< 8 MiB)
        # SPEC-0001 / STORY-0003 guardrail: a release-shape nesdit binary
        # MUST stay under 8 MiB so the single-binary distribution story
        # holds. `wc -c < file` is portable across macOS and linux
        # (avoids GNU-only `stat -c%s`).
        run: |
          bytes=$(wc -c < bin/nesdit | tr -d ' ')
          limit=8388608
          echo "nesdit binary size: ${bytes} bytes (limit: ${limit})"
          if [ "${bytes}" -ge "${limit}" ]; then
            echo "::error::nesdit binary exceeded 8 MiB limit (${bytes} >= ${limit})"
            exit 1
          fi

  ticket-trailer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require Ticket trailer in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eq '^Ticket: (EPIC|STORY|TASK|BUG)-[0-9]+'; then
            echo "PR body is missing the required Ticket trailer."
            echo 'Expected a line matching: ^Ticket: (EPIC|STORY|TASK|BUG)-\d+'
            echo "See .github/pull_request_template.md."
            exit 1
          fi
