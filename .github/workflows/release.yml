# release.yml — Automated semver releases via release-please + GoReleaser.
#
# Flow:
#   1. On every push to main, release-please inspects conventional commits
#      and either opens/updates a "Release PR" or does nothing (if no
#      releasable commits have landed since the last release).
#   2. When a Release PR is merged, release-please creates a GitHub Release
#      and a git tag (e.g. v0.0.1). That sets `release_created: true`.
#   3. The goreleaser job fires only when `release_created` is true. It
#      builds linux/amd64, linux/arm64, and darwin/arm64 binaries and
#      uploads them as assets to the release that release-please created.
#
# First release:
#   .release-please-manifest.json is bootstrapped at "0.0.0". The first
#   conventional commit of type feat or fix will produce a Release PR that
#   bumps to v0.0.1. Merge that PR to publish the first release.
#
# Conventional commit types that trigger a release:
#   fix:  → patch bump  (0.0.x)
#   feat: → minor bump  (0.x.0)
#   feat!: or BREAKING CHANGE: → major bump (x.0.0)
#
# SHA ↔ tag mappings verified via scripts/check-action-pins.sh:
#   actions/checkout                 11bd7190... → v4.2.2
#   actions/setup-go                 d35c59ab... → v5.5.0
#   googleapis/release-please-action 45996ed1... → v5.0.0
#   goreleaser/goreleaser-action     1a80836c... → v7.2.1

name: release

on:
  # Only run after the ci workflow completes successfully on main.
  # This prevents release PRs from opening (or GoReleaser from firing)
  # when tests are red.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bail out immediately if ci did not pass.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge Release PR
        # steps.release.outputs.pr is a JSON object; extract .number into an
        # env var to avoid shell interpolation issues with the raw JSON string.
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"

  goreleaser:
    needs: release-please
    # Only run when release-please has created a new release (i.e. a Release
    # PR was merged and a GitHub Release + tag now exist).
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch the full history so GoReleaser can walk commits for the
          # changelog and produce accurate previous-tag comparisons.
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
