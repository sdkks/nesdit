# release.yml — Automated semver releases via release-please + GoReleaser.
#
# Flow:
#   1. After ci passes on any push to main, release-please inspects
#      conventional commits and either opens/updates a "Release PR" or
#      does nothing (no releasable commits since last release).
#   2. The Release PR is auto-merged once its own CI passes.
#   3. When release-please processes the merged Release PR it pushes a
#      semver tag (e.g. v0.0.1) and creates a draft-free GitHub Release.
#   4. The goreleaser job in this file is triggered by that tag push.
#      It builds linux/amd64, linux/arm64, and darwin/arm64 binaries and
#      uploads them as assets to the release release-please created.
#
# Why two triggers (workflow_run + push tags)?
#   workflow_run[ci] gates release-please so it only opens Release PRs
#   when tests are green. goreleaser uses push[tags] because the tag is
#   a real push event that fires reliably after the Release PR merges —
#   workflow_run does NOT fire on auto-merge commits.
#
# Conventional commit types that trigger a release:
#   fix:  → patch bump  (0.0.x)
#   feat: → minor bump  (0.x.0)  [capped at patch while pre-major]
#   feat!: or BREAKING CHANGE: → major bump (x.0.0)
#
# SHA ↔ tag mappings verified via scripts/check-action-pins.sh:
#   actions/checkout                 11bd7190... → v4.2.2
#   actions/setup-go                 d35c59ab... → v5.5.0
#   googleapis/release-please-action 45996ed1... → v5.0.0
#   goreleaser/goreleaser-action     1a80836c... → v7.2.1

name: release

on:
  # release-please: runs after ci passes on main pushes.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

  # goreleaser: runs when release-please pushes a semver tag.
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge Release PR
        # steps.release.outputs.pr is a JSON object — put it in an env var
        # and parse with jq to avoid shell interpolation of the raw JSON.
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
