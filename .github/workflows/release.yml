# release.yml — Automated semver releases via semantic-release + GoReleaser.
#
# Flow:
#   1. After ci passes on a push to main, semantic-release inspects
#      conventional commits and either pushes a semver tag + GitHub Release
#      or does nothing (no releasable commits since last release).
#   2. The goreleaser job is triggered by that tag push.
#      It builds linux/amd64, linux/arm64, and darwin/arm64 binaries and
#      uploads them as assets to the release semantic-release created.
#
# Why two triggers (workflow_run + push tags)?
#   workflow_run[ci] gates semantic-release so it only runs when tests are
#   green. goreleaser uses push[tags] because the tag is a real push event
#   that fires reliably — workflow_run does NOT fire on tag pushes.
#
# Conventional commit types that trigger a release:
#   fix:  → patch bump  (0.0.x)
#   feat: → minor bump  (0.x.0)
#   feat!: or BREAKING CHANGE: → major bump (x.0.0)
#
# SHA ↔ tag mappings verified via scripts/check-action-pins.sh:
#   actions/checkout                 11bd7190... → v4.2.2
#   actions/setup-go                 d35c59ab... → v5.5.0
#   cycjimmy/semantic-release-action b12c8f60... → v6.0.0
#   goreleaser/goreleaser-action     1a80836c... → v7.2.1

name: release

on:
  # semantic-release: runs after ci passes on main pushes.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

  # goreleaser: runs when semantic-release pushes a semver tag.
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Must use a PAT (RELEASE_TOKEN), not GITHUB_TOKEN. Tags and commits
          # pushed by GITHUB_TOKEN do not trigger downstream workflow runs
          # (GitHub prevents loops). The PAT push is treated as a real user
          # event, so the goreleaser push[tags:v*] trigger fires correctly.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
